{% extends "base.html" %}
{% block title %}{{ 'Edit' if playbook else 'New' }} Playbook{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ 'Edit' if playbook else 'New' }} Playbook</h1>
  <div class="actions">
    <a href="{{ url_for('playbooks.list') }}" class="btn btn-secondary">Cancel</a>
  </div>
</div>

<div class="card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-input" value="{{ playbook.name if playbook else '' }}" required>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-textarea">{{ playbook.description if playbook else '' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Steps</label>
      <textarea name="steps" class="form-textarea" style="min-height:200px">{% if playbook %}{% for step in steps %}{{ step }}
{% endfor %}{% endif %}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if playbook else 'Create Playbook' }}</button>
  </form>
</div>
{% endblock %}

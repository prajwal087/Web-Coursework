{% extends "base.html" %}
{% block title %}{{ 'Edit' if analyst else 'New' }} Analyst{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ 'Edit' if analyst else 'New' }} Analyst</h1>
  <div class="actions">
    <a href="{{ url_for('analysts.list_view') }}" class="btn btn-secondary">Cancel</a>
  </div>
</div>

<div class="card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" value="{{ analyst.username if analyst else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" value="{{ analyst.email if analyst else '' }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Password {% if analyst %}(leave blank to keep){% endif %}</label>
        <input type="password" name="password" class="form-input" {{ 'required' if not analyst else '' }}>
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="analyst" {{ 'selected' if analyst and analyst.role == 'analyst' else '' }}>Analyst</option>
          <option value="lead" {{ 'selected' if analyst and analyst.role == 'lead' else '' }}>Lead</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if analyst else 'Create Analyst' }}</button>
  </form>
</div>
{% endblock %}

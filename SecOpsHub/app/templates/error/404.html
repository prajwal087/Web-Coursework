{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-icon"><i class="ti ti-search-off" style="font-size:4rem;color:var(--accent-green)"></i></div>
  <div class="error-code green">404</div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-desc">The page you're looking for doesn't exist or has been moved. Check the URL or navigate from the sidebar.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    <i class="ti ti-arrow-left" style="vertical-align:middle;margin-right:0.25rem"></i> Back to Dashboard
  </a>
</div>
{% endblock %}

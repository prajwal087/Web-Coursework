{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-icon"><i class="ti ti-shield-lock" style="font-size:4rem;color:var(--accent-amber)"></i></div>
  <div class="error-code amber">403</div>
  <h1 class="error-title">Access Denied</h1>
  <p class="error-desc">You don't have permission to access this resource. Contact your administrator if you believe this is a mistake.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    <i class="ti ti-arrow-left" style="vertical-align:middle;margin-right:0.25rem"></i> Back to Dashboard
  </a>
</div>
{% endblock %}

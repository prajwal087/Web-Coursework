{% extends "base.html" %}
{% block title %}405 Method Not Allowed{% endblock %}
{% block content %}
<div class="empty-state" style="padding:6rem 2rem">
  <div class="empty-state-icon" style="font-size:5rem;opacity:0.15;font-family:var(--font-mono);font-weight:800;letter-spacing:-.05em;color:var(--severity-high);text-shadow:0 0 80px rgba(251,146,60,.1)">405</div>
  <div class="empty-state-text" style="font-size:1.3rem;margin-top:-.5rem">Method Not Allowed</div>
  <div class="empty-state-sub" style="max-width:400px;margin:0 auto 1.5rem">This endpoint does not support the requested method.</div>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="ti ti-arrow-left"></i> Return to Command Center</a>
</div>
{% endblock %}

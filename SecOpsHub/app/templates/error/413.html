{% extends "base.html" %}
{% block title %}413 Payload Too Large{% endblock %}
{% block content %}
<div class="empty-state" style="padding:6rem 2rem">
  <div class="empty-state-icon" style="font-size:5rem;opacity:0.15;font-family:var(--font-mono);font-weight:800;letter-spacing:-.05em;color:var(--severity-critical);text-shadow:0 0 80px rgba(248,113,113,.1)">413</div>
  <div class="empty-state-text" style="font-size:1.3rem;margin-top:-.5rem">Payload Too Large</div>
  <div class="empty-state-sub" style="max-width:400px;margin:0 auto 1.5rem">The uploaded content exceeds the maximum allowed size.</div>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="ti ti-arrow-left"></i> Return to Command Center</a>
</div>
{% endblock %}

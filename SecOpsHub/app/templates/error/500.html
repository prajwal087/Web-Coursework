{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-icon"><i class="ti ti-alert-triangle" style="font-size:4rem;color:var(--accent-red)"></i></div>
  <div class="error-code red">500</div>
  <h1 class="error-title">Internal Server Error</h1>
  <p class="error-desc">Something went wrong on our end. The error has been logged and we're looking into it. Please try again later.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
    <i class="ti ti-arrow-left" style="vertical-align:middle;margin-right:0.25rem"></i> Back to Dashboard
  </a>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Password Analysis{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title"><i class="ti ti-lock" style="font-size:1.3rem;color:var(--accent);margin-right:0.4rem;vertical-align:middle"></i>Password Analysis</h1>
  <div class="actions">
    <a href="{{ url_for('tools.index') }}" class="btn btn-secondary">Back to Tools</a>
  </div>
</div>

<div class="result-card">
  <div class="result-title"><i class="ti ti-shield-check" style="vertical-align:middle;margin-right:0.3rem"></i>Strength Assessment</div>
  <div class="strength-meter">
    <div class="strength-bar">
      <div class="strength-fill {{ analysis.strength.lower().replace(' ', '-') }}"></div>
    </div>
    <span class="strength-label {{ analysis.strength.lower().replace(' ', '-') }}">{{ analysis.strength }}</span>
  </div>

  <div style="margin-top:1.5rem">
    {% for key, value in analysis.items() %}
    <div class="result-item">
      <span class="result-key">{{ key }}</span>
      <span class="result-value">{{ value }}</span>
    </div>
    {% endfor %}
  </div>
</div>

{% if case_id %}
<form method="POST" action="{{ url_for('tools.save_evidence') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="case_id" value="{{ case_id }}">
  <input type="hidden" name="source" value="password_analyzer">
  <input type="hidden" name="title" value="Password Analysis — {{ analysis.strength }}">
  <input type="hidden" name="content" value="Password Analysis:
Strength: {{ analysis.strength }}
Score: {{ analysis.score }}/7
Length: {{ analysis.length }}
Uppercase: {{ analysis.has_upper }}
Lowercase: {{ analysis.has_lower }}
Digit: {{ analysis.has_digit }}
Special: {{ analysis.has_special }}">
  <div class="tool-actions">
    <button type="submit" class="btn btn-primary"><i class="ti ti-device-floppy" style="font-size:1rem;vertical-align:middle;margin-right:0.25rem"></i>Save as Evidence</button>
  </div>
</form>
{% endif %}
{% endblock %}
